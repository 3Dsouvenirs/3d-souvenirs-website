<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You | 3D Souvenirs</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07539a">
    <link rel="icon" href="/3DSouvenirs.png" type="image/png">
    <link rel="stylesheet" href="/assets/site.css">
    <script src="/assets/site.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="/" aria-label="3D Souvenirs home">
                <img
                    class="brand-logo"
                    src="/3DSouvenirs.png"
                    width="500"
                    height="482"
                    alt=""
                >
                <span class="brand-copy">
                    <strong>3D Souvenirs</strong>
                    <span>Wholesale lenticular products</span>
                </span>
            </a>
            <a class="button button-secondary" href="/">Return home</a>
        </div>
    </header>

    <main class="thank-you-page" id="main-content">
        <section class="thank-you-card">
            <div class="success-mark" aria-hidden="true">✓</div>
            <p class="eyebrow">Message received</p>
            <h1>Thank you for reaching out.</h1>
            <p>
                Your inquiry has been sent to 3D Souvenirs. We’ll take a
                look and respond personally as soon as possible.
            </p>
            <div class="button-row">
                <a class="button button-primary" href="/samples/">View sample designs</a>
                <a class="button button-secondary" href="/">Back to the homepage</a>
            </div>
        </section>
    </main>
</body>
</html>
